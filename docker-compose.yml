# Local mode: `docker compose up`, then open http://localhost:5174 (simulator) and http://localhost:5173 (dashboard).
# All Node services share one container so that "localhost:8788" means the same issuer to the browser and the API.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # inbox UI
      - "1025:1025" # SMTP

  app:
    build: .
    depends_on:
      - dynamodb
      - mailpit
    environment:
      DDB_ENDPOINT: http://dynamodb:8000
      SMTP_URL: smtp://mailpit:1025
      SEED_ON_START: demo
      VITE_HOST: 0.0.0.0
    ports:
      - "8787:8787" # API: /mcp, /.well-known/*, /api/*, /dev/*
      - "8788:8788" # dev OAuth server
      - "5173:5173" # caregiver dashboard
      - "5174:5174" # voice simulator
      - "8790:8790" # simulator agent backend
